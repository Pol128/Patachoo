# La publication de l'image, faite par la CI et par elle seule.
#
# Ce que ce fichier achète, et qui manquait tant que l'image était construite à
# la main : la construction ne dépend plus d'un poste de développement — donc
# plus de ses jetons ni de ce qui traîne dessus —, et chaque image publiée porte
# une attestation de provenance qui la relie au commit et au workflow qui l'ont
# produite. `ghcr.io/pol128/patachoo:latest` cesse d'être une promesse
# invérifiable ; INSTALL.md dit à l'hébergeant comment la vérifier.
#
# Les binaires publiés dans la Release suivent le même chemin : ils sortent de
# la même construction que l'image, et portent la même sorte d'attestation. Un
# binaire déposé à la main serait moins vérifiable que l'image, ce qui prendrait
# ce fichier à contre-sens.
#
# Il ne rejoue pas `./verifie`. Le tag se pose sur un commit de `main` que
# verifie.yml a déjà passé, et la passe `-race` coûte vingt minutes (DOD.md §1).
# La contrepartie est assumée, et elle s'écrit : un tag posé sur un commit non
# vérifié publierait du non vérifié.
#
# Les actions tierces y sont épinglées par empreinte de commit, version exacte
# en commentaire : la convention, sa raison et la commande qui remonte une
# empreinte sont écrites en tête de verifie.yml. C'est ici qu'elle compte le
# plus — ce job porte `packages: write` et de quoi signer une attestation.

name: publier

# Un tag, et rien d'autre. Pas de `branches:`, pas de `pull_request:`, pas de
# `workflow_dispatch:` — un déclencheur manuel rendrait publiable n'importe
# quelle ref, et c'est précisément ce que ce fichier ferme.
on:
  push:
    tags:
      - "v*"

jobs:
  publier:
    runs-on: ubuntu-latest

    # L'empreinte est reprise par le job de la Release, qui l'écrit dans ses
    # notes : INSTALL.md apprend à épingler par empreinte, encore faut-il que
    # celle de la version publiée soit lisible quelque part sans aller
    # interroger le registre.
    outputs:
      empreinte: ${{ steps.pousser.outputs.digest }}

    # Les droits qu'il faut, et pas un de plus. Le bloc va sur le job, comme
    # dans verifie.yml : ce qui est écrit ici ne vaut que pour lui.
    #
    #   contents: read      — lire le dépôt à construire
    #   packages: write     — pousser l'image sur ghcr.io
    #   id-token: write     — le jeton OIDC dont l'attestation tire sa signature
    #   attestations: write — enregistrer l'attestation produite
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0

      # La clé du registre est celle du job : éphémère, limitée à ce dépôt, et
      # jamais recopiée nulle part. Un jeton personnel déposé en secret de dépôt
      # ferait vivre cette clé ailleurs que dans la CI — c'est exactement ce que
      # ce workflow cherche à faire disparaître.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f   # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # buildx, et pas QEMU. L'étape Go du Dockerfile tourne en
      # `--platform=$BUILDPLATFORM` et compile en croisé (`CGO_ENABLED=0`) ;
      # l'image finale est `FROM scratch`. Rien ne s'exécute à l'architecture
      # cible, l'émulation coûterait dix fois le temps de construction pour
      # rien — c'est écrit dans le Dockerfile lui-même.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069   # v4.4.1

      # La version que le binaire annoncera : le nom du tag privé de son « v »
      # initial (v0.1.0 → 0.1.0). Sans elle, le binaire dirait « dev »
      # (cmd/patachoo/version.go) et l'étiquette OCI
      # org.opencontainers.image.version avec lui (Dockerfile).
      - name: Version
        id: version
        run: echo "numero=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Les références à pousser. `type=semver` rend 0.1.0 et 0.1 pour un
      # v0.1.0 ; `latest=auto` n'ajoute `latest` que si le tag n'est pas une
      # pré-version — v0.2.0-rc.1 publie donc 0.2.0-rc.1 seul, et ne déplace pas
      # le tag que le docker-compose par défaut suit.
      #
      # Seuls les tags sont repris d'ici, pas les étiquettes : le Dockerfile
      # écrit déjà les siennes, et celles de cette action les remplaceraient par
      # les métadonnées GitHub du dépôt.
      - name: Références
        id: references
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302   # v6.2.0
        with:
          images: ghcr.io/pol128/patachoo
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: latest=auto

      - name: Construire et pousser
        id: pousser
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc   # v7.4.0
        with:
          context: .
          # Les trois architectures qu'INSTALL.md promet sous un même manifeste.
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.references.outputs.tags }}
          build-args: |
            VERSION=${{ steps.version.outputs.numero }}

      # Sur l'empreinte rendue par la poussée, jamais sur un tag : un tag bouge,
      # une empreinte non. `push-to-registry` dépose l'attestation à côté de
      # l'image dans le registre, ce qui la rend vérifiable sans passer par
      # l'API GitHub — la commande est dans INSTALL.md.
      - name: Attester la provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8   # v4.2.2
        with:
          subject-name: ghcr.io/pol128/patachoo
          subject-digest: ${{ steps.pousser.outputs.digest }}
          push-to-registry: true

      # ─── Les binaires ──────────────────────────────────────────────────────
      #
      # Ils sortent de la construction de l'image, et d'elle seule : il n'y a
      # aucune compilation dans ce fichier. La ligne de compilation — drapeaux,
      # version injectée, GOARM — vit dans le Dockerfile, à un seul endroit ;
      # la recopier ici en ferait deux, et le binaire téléchargé cesserait un
      # jour d'être celui de l'image sans que rien ne le signale.
      #
      # Même contexte, mêmes plateformes, même VERSION que l'étape qui a poussé
      # l'image, sur le même constructeur buildx : chaque étape du Dockerfile
      # est reprise du cache, rien n'est recompilé. Seule la destination
      # change — un répertoire local au lieu du registre. L'image finale est
      # `FROM scratch` avec le binaire à sa racine, d'où
      # `binaires/linux_amd64/patachoo` et ses deux voisins (buildx range une
      # plateforme par sous-répertoire, `linux_arm_v7` pour la troisième).
      - name: Extraire les binaires
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc   # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          outputs: type=local,dest=binaires
          build-args: |
            VERSION=${{ steps.version.outputs.numero }}

      # Les noms ne portent pas de numéro de version, et c'est un engagement :
      # /releases/latest/download/<nom> doit rester valable d'une version à
      # l'autre, et aucun de ces trois noms ne disparaît une fois publié.
      #
      # Chaque archive contient `patachoo`, `LICENSE` et `NOTICE` à sa racine,
      # sans répertoire intermédiaire : Apache-2.0 demande que la licence
      # accompagne ce qu'on redistribue, et `tar xzf … patachoo` doit suffire.
      # Propriétaire numérique 0 : le nom du compte du runner n'a rien à faire
      # chez l'hébergeant. Un binaire absent fait échouer `install`, donc le
      # job — une Release à laquelle manquerait une plateforme ne part pas.
      #
      # Les sommes portent sur les archives, pas sur les binaires nus : c'est ce
      # que l'hébergeant télécharge, donc ce qu'il doit pouvoir vérifier avant
      # de l'ouvrir. Calculées depuis `actifs/`, elles nomment les archives sans
      # chemin, et `sha256sum -c` passe là où on les a téléchargées.
      - name: Archiver les binaires
        run: |
          set -euo pipefail
          mkdir actifs
          for cible in amd64 arm64 armv7; do
            case "$cible" in
              armv7) source=binaires/linux_arm_v7 ;;
              *)     source="binaires/linux_$cible" ;;
            esac
            racine=$(mktemp -d)
            install -m 0755 "$source/patachoo" "$racine/patachoo"
            install -m 0644 LICENSE NOTICE "$racine/"
            tar -C "$racine" --owner=0 --group=0 --numeric-owner \
              -czf "actifs/patachoo_linux_$cible.tar.gz" patachoo LICENSE NOTICE
          done
          cd actifs
          sha256sum patachoo_linux_*.tar.gz > sommes-sha256.txt

      # Les archives, attestées comme l'image : ici, parce que c'est ce job qui
      # porte `id-token: write` et `attestations: write`. Une seule attestation
      # couvre les trois sujets, et `gh attestation verify` la retrouve depuis
      # n'importe laquelle des trois archives.
      - name: Attester les archives
        id: attester-archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8   # v4.2.2
        with:
          subject-path: actifs/patachoo_linux_*.tar.gz

      # Le paquet d'attestation, publié à côté des archives : avec lui,
      # `gh attestation verify --bundle` vérifie sans interroger l'API GitHub.
      # L'action l'écrit en JSON Lines, une attestation par ligne — d'où
      # l'extension.
      - name: Joindre le paquet d'attestation
        env:
          PAQUET: ${{ steps.attester-archives.outputs.bundle-path }}
        run: cp "$PAQUET" actifs/provenance.jsonl

      # Les actifs passent au job de la Release par un artefact du run, parce
      # que ce job-ci n'a pas `contents: write` et ne doit pas l'avoir : c'est
      # le seul moyen de téléverser ce qu'on a attesté ici sans réunir les deux
      # jeux de droits dans un même job. Un jour de rétention suffit — la
      # Release les garde, l'artefact n'est qu'un transit.
      - name: Transmettre les actifs à la Release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
        with:
          name: actifs
          path: actifs/
          if-no-files-found: error
          retention-days: 1

  # ─── La Release ──────────────────────────────────────────────────────────
  #
  # Ce que ce job achète : le pied de page du produit affiche le numéro de
  # version en lien vers /releases (cmd/patachoo/vues/mise-en-page.html), et un
  # tag seul ne remplit pas cette page — il s'range sous l'onglet « Tags », et
  # /releases annonce « no releases published ». Sans ce job, le produit
  # enverrait ses utilisateurs sur une page vide le jour même où il commence à
  # leur montrer un numéro de version.
  #
  # Un job à lui, et non une étape de plus dans le précédent. Créer une Release
  # demande `contents: write`, dont la construction n'a aucun besoin : séparés,
  # les deux droits ne se rejoignent nulle part. Celui qui pousse l'image ne
  # peut pas écrire dans le dépôt ; celui qui écrit la Release ne peut pas
  # pousser d'image. C'est la règle que ce fichier s'est donnée plus haut.
  #
  # `gh` plutôt qu'une action tierce de plus pour créer la Release : PATA-88 a
  # épinglé les actions de ce dépôt par empreinte, et écrit que leur remontée
  # est un geste manuel faute d'automate. Une empreinte de plus à tenir à jour
  # pour ce que la CLI préinstallée sur le runner fait en quelques lignes serait
  # un mauvais échange.
  release:
    needs: publier
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0

      # Les archives, leurs sommes et leur paquet d'attestation, tels que le job
      # précédent les a produits et attestés. Ici, on ne fait que les poser.
      - name: Récupérer les actifs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c   # v8.0.1
        with:
          name: actifs
          path: actifs

      # Le transit n'a rien altéré, et le fichier des sommes se rejoue tel
      # qu'on le publie : ce que l'hébergeant lancera, on le lance d'abord ici.
      # Un rouge arrête le job avant que la Release n'existe.
      - name: Contrôler les sommes
        working-directory: actifs
        run: sha256sum -c sommes-sha256.txt

      - name: Publier la Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EMPREINTE: ${{ needs.publier.outputs.empreinte }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          notes=$(mktemp)

          # Les notes sont la section du journal, pas la liste des commits :
          # CHANGELOG.md dit ce que l'utilisateur verra de différent, ce qu'un
          # « git log » ne dira jamais. La section est délimitée par son titre
          # et par le « ## » suivant.
          awk -v entete="## v$version " '
            index($0, entete) == 1 { dedans = 1; next }
            dedans && /^## /       { exit }
            dedans                 { print }
          ' CHANGELOG.md > "$notes"

          # Une pré-version n'a pas de section, et c'est voulu : on ne clôt pas
          # un journal pour une rc. On écrit alors nous-mêmes de quoi remplir la
          # page, plutôt que de passer --generate-notes — la combinaison de ce
          # drapeau avec --notes-file n'est pas définie, et la liste des commits
          # n'apprend rien à qui installe.
          if [ ! -s "$notes" ]; then
            echo "aucune section « ## v$version » dans CHANGELOG.md — notes minimales"
            printf 'Pré-version. Le journal est tenu dans [CHANGELOG.md](../blob/main/CHANGELOG.md) ;\ncelle-ci ne clôt aucune section.\n' > "$notes"
          fi

          # L'image, citée par son empreinte : c'est la forme qu'INSTALL.md
          # recommande d'épingler, et elle ne se lit nulle part ailleurs sans
          # interroger le registre.
          {
            printf '\n---\n\n## Image\n\n'
            printf '    docker pull ghcr.io/pol128/patachoo@%s\n\n' "$EMPREINTE"
            printf 'Provenance : `gh attestation verify oci://ghcr.io/pol128/patachoo@%s --repo %s`\n' \
              "$EMPREINTE" "$GITHUB_REPOSITORY"
          } >> "$notes"

          # Le même critère que « latest=auto » chez metadata-action : un tag
          # qui porte un tiret est une pré-version. Sans ce drapeau,
          # v0.1.0-rc.1 deviendrait la « latest release » affichée par GitHub,
          # alors qu'elle ne déplace même pas le tag « latest » de l'image.
          drapeaux=(--title "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file "$notes")
          case "$GITHUB_REF_NAME" in
            *-*) drapeaux+=(--prerelease) ;;
          esac

          # Les cinq actifs, nommés un par un plutôt que par un motif : un
          # fichier qui manquerait fait échouer la commande, au lieu de publier
          # une Release amputée sans le dire.
          gh release create "$GITHUB_REF_NAME" "${drapeaux[@]}" \
            actifs/patachoo_linux_amd64.tar.gz \
            actifs/patachoo_linux_arm64.tar.gz \
            actifs/patachoo_linux_armv7.tar.gz \
            actifs/sommes-sha256.txt \
            actifs/provenance.jsonl
