# La Definition of Done, lancée ailleurs que dans la tête de celui qui a écrit
# le code (DOD.md §1).
#
# Ce fichier ne réénumère aucun des contrôles : il appelle `./verifie`, et rien
# d'autre. Un critère ajouté au script arrive donc en CI sans qu'on touche à ce
# YAML — sinon on entretient deux définitions du vert, dont une seule serait à
# jour.

name: verifie

on:
  # Toutes les branches : « sur chaque poussée » pris au mot. Une branche qui
  # porte une demande de fusion déclenche donc deux fois ; c'est accepté, le
  # dépôt est petit.
  push:
  pull_request:
    branches: [main]
  # Et une fois par semaine sans que personne n'ait rien poussé : `./verifie`
  # lance `govulncheck`, qui interroge vuln.go.dev à l'exécution. Un rouge du
  # lundi sur du code inchangé signale donc une faille publiée depuis la
  # dernière poussée — le seul signal que les deux déclencheurs ci-dessus ne
  # peuvent pas donner, puisqu'ils ont la date du dernier commit et non celle
  # du jour.
  #
  # Deux limites, et on les écrit plutôt que de les contourner :
  #   - une planification ne s'exécute que sur la dernière version de ce
  #     fichier telle qu'elle est sur la branche par défaut ; elle ne tourne
  #     donc jamais depuis une branche de travail ;
  #   - sur un dépôt public, GitHub désactive automatiquement les workflows
  #     planifiés après soixante jours sans activité sur le dépôt — c'est-à-dire
  #     exactement dans le cas du projet dormant, celui où cette passe servirait
  #     le plus.
  #
  # L'heure n'est pas ronde exprès : GitHub retarde les planifications posées
  # au haut de l'heure, où tout le monde les pose.
  schedule:
    - cron: "17 4 * * 1"

jobs:
  verifie:
    runs-on: ubuntu-latest

    # Le job ne pousse rien, ne publie rien, ne commente rien. Il lit le dépôt.
    permissions:
      contents: read

    # La passe longue, et elle seule : elle contient tout ce que contient la
    # passe courte, la doubler ne ferait que payer une seconde fois l'accès
    # réseau de govulncheck. C'est un `env`, pas une commande — le script reste
    # la seule définition du vert, et la règle de l'en-tête tient.
    env:
      AVEC_RACE: "1"

    steps:
      - uses: actions/checkout@v4

      # Aucun numéro de version ici : go.mod est la seule source. Une version
      # figée dans ce fichier divergerait en silence du jour où go.mod change.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: ./verifie
