# La Definition of Done, lancée ailleurs que dans la tête de celui qui a écrit
# le code (DOD.md §1).
#
# Ce fichier ne réénumère aucun des contrôles : il appelle `./verifie`, et rien
# d'autre. Un critère ajouté au script arrive donc en CI sans qu'on touche à ce
# YAML — sinon on entretient deux définitions du vert, dont une seule serait à
# jour.
#
# --- Actions tierces : épinglées par empreinte -------------------------------
#
# Toute action tierce référencée par ce dépôt — ici comme dans publier.yml —
# s'écrit `@<empreinte de commit sur 40 caractères>`, suivie sur la même ligne
# d'un commentaire `# vX.Y.Z` qui donne la version exacte ainsi épinglée.
#
# Jamais `@v4`. Un tag de version majeure est redéployé par son mainteneur à
# chaque version mineure : sous ce nom, ce que la CI exécute cesserait d'être
# décidé par le dépôt, et changerait sans qu'une ligne bouge ici. Qui obtient
# le droit de déplacer un de ces tags exécute son code sur le runner — et, du
# côté de publier.yml, le fait signer par une attestation de provenance
# authentique. Le commentaire de version n'est pas décoratif : une empreinte
# nue ne dit pas ce qu'elle épingle, et personne ne saurait quelles notes de
# version lire avant de monter.
#
# Pour monter une action de version, résoudre l'empreinte de la version visée,
# jamais celle du tag mouvant — sinon le commentaire ne pourrait pas nommer la
# version :
#
#     gh api --paginate repos/<propriétaire>/<action>/tags \
#       --jq '.[] | "\(.name) \(.commit.sha)"'
#
# L'empreinte et son commentaire changent ensemble, dans le même geste : l'un
# sans l'autre laisse un commentaire qui ment. Et `actions/checkout` est
# référencée par les deux workflows : elle y porte la même empreinte, faute de
# quoi le même dépôt exécuterait deux versions de la même action.
#
# L'entretien est manuel, et c'est un arbitrage écrit plutôt qu'un oubli :
# Dependabot n'ajouterait que du confort contre un flux de demandes de fusion à
# relire, sur un projet à un seul mainteneur (PATA-91). Le prix en est qu'une
# empreinte vieillit en silence — un correctif de sécurité de l'action n'arrive
# plus de lui-même.

name: verifie

on:
  # `main` seulement, et non plus toutes les branches. Le double déclenchement
  # était assumé tant que les runners étaient ceux de GitHub, lancés en
  # parallèle et sans file : une branche portant une demande de fusion payait
  # deux jobs, et personne n'attendait. Depuis la bascule sur un runner
  # auto-hébergé, les jobs se suivent au lieu de se croiser, et ce doublon coûte
  # la moitié de la capacité de la machine — 38 minutes par job, mesurées.
  #
  # Ce qu'on perd : une branche poussée sans demande de fusion n'est plus
  # vérifiée. En pratique la boucle d'agents en ouvre une systématiquement, et
  # `pull_request` couvre alors le même commit.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Et une fois par semaine sans que personne n'ait rien poussé : `./verifie`
  # lance `govulncheck`, qui interroge vuln.go.dev à l'exécution. Un rouge du
  # lundi sur du code inchangé signale donc une faille publiée depuis la
  # dernière poussée — le seul signal que les deux déclencheurs ci-dessus ne
  # peuvent pas donner, puisqu'ils ont la date du dernier commit et non celle
  # du jour.
  #
  # Deux limites, et on les écrit plutôt que de les contourner :
  #   - une planification ne s'exécute que sur la dernière version de ce
  #     fichier telle qu'elle est sur la branche par défaut ; elle ne tourne
  #     donc jamais depuis une branche de travail ;
  #   - sur un dépôt public, GitHub désactive automatiquement les workflows
  #     planifiés après soixante jours sans activité sur le dépôt — c'est-à-dire
  #     exactement dans le cas du projet dormant, celui où cette passe servirait
  #     le plus.
  #
  # L'heure n'est pas ronde exprès : GitHub retarde les planifications posées
  # au haut de l'heure, où tout le monde les pose.
  schedule:
    - cron: "17 4 * * 1"

# Un seul job à la fois sur la machine, et les autres attendent leur tour.
# Deux services de runner y sont enregistrés sur ce dépôt (PATA-132) : sans ce
# groupe, deux passes `-race` partent ensemble sur les mêmes cœurs, chacune
# double sa durée, et plus aucune mesure de durée n'est reproductible.
#
# La clé est une constante, et ce n'est pas un oubli. L'idiome habituel,
# `${{ github.workflow }}-${{ github.ref }}`, dédoublonne les runs d'une même
# branche : il laisserait passer précisément ce qu'on veut empêcher, deux jobs
# sur deux refs différentes au même moment. Le problème n'est pas la
# déduplication par branche, c'est la capacité de la machine.
#
# On met en file, on n'annule jamais : une passe `-race` annulée à quarante
# minutes jette ce qu'on a de plus cher à produire, et une course ne se trouve
# qu'en rejouant la passe (DOD.md §1). D'où `cancel-in-progress: false`, qui
# épargne le job en cours — et `queue: max`, sans lequel il ne suffit pas : par
# défaut, un groupe ne garde qu'un seul run en attente, et le troisième arrivé
# annule celui qui attendait déjà.
#
# Le coût, accepté : les jobs se sérialisent, et une demande de fusion attend
# derrière un job de `main`, parfois des dizaines de minutes. Deux passes
# concurrentes n'iraient pas plus vite — elles se partagent les mêmes cœurs.
# Ce groupe ne rend pas pour autant la machine au repos : un `./verifie` lancé
# hors CI peut toujours y croiser un job.
concurrency:
  group: verifie-sd-124046
  cancel-in-progress: false
  queue: max

jobs:
  verifie:
    # Runner auto-hébergé : les minutes hébergées par GitHub sont facturées,
    # et une boucle d'agents qui pousse toutes les dix minutes en consomme
    # plus qu'aucun plafond raisonnable n'en couvre. Les runners qu'on héberge
    # soi-même ne le sont pas. Le jour où ce dépôt devient public, il faudra
    # revenir en arrière : une demande de fusion venue d'un fork exécuterait
    # du code non fiable sur la machine.
    runs-on: [self-hosted, Linux, X64]

    # Le job ne pousse rien, ne publie rien, ne commente rien. Il lit le dépôt.
    permissions:
      contents: read

    # La passe longue, et elle seule : elle contient tout ce que contient la
    # passe courte, la doubler ne ferait que payer une seconde fois l'accès
    # réseau de govulncheck. C'est un `env`, pas une commande — le script reste
    # la seule définition du vert, et la règle de l'en-tête tient.
    env:
      AVEC_RACE: "1"
      # Le répertoire de travail d'un runner auto-hébergé survit d'un job au
      # suivant, et avec lui le cache de `go test` — que les runners jetables
      # de GitHub laissaient toujours froid. Sans ce `-count=1`, un job rendrait
      # un vert sorti du cache : acceptable pour un test déterministe, pas pour
      # `-race`, qui ne trouve une course qu'en la rejouant.
      GOFLAGS: -count=1

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0

      # Aucun numéro de version ici : go.mod est la seule source. Une version
      # figée dans ce fichier divergerait en silence du jour où go.mod change.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff   # v5.6.0
        with:
          go-version-file: go.mod

      - run: ./verifie
