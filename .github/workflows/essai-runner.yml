# Essai jetable : la vraie DoD (AVEC_RACE=1 ./verifie) sur le runner
# auto-hébergé, pour mesurer sa durée réelle. À supprimer ensuite.
name: essai-runner

on:
  push:
    branches: [essai/runner-autoheberge]

jobs:
  essai:
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
    env:
      AVEC_RACE: "1"
      # Le cache de go test survit d'un job à l'autre sur un runner
      # persistant : sans cela, -race ne rejouerait pas ses dés.
      GOFLAGS: -count=1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: ./verifie
