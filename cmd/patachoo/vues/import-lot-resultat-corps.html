<h1>Lot lancé</h1>
{{if .Ecartees}}
<p>Lignes écartées :</p>
<ul class="ecartees">
{{range .Ecartees}}<li class="ecartee"><code>{{.Ligne}}</code> — {{.Motif}}</li>
{{end}}</ul>
{{end}}
{{with .Suivi}}{{template "import-lot-suivi-corps.html" .}}{{end}}
<p><a href="/recettes/importer/lot">Lancer un autre lot</a></p>
