<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Titre}}</title>
<link rel="stylesheet" href="/statique/patachoo.css">
<script src="/statique/htmx.min.js" defer></script>
</head>
<body>
<header>
<a class="marque" href="/">Patachoo</a>
<nav>
<a href="/recettes">Recettes</a>
<a href="/recettes/nouvelle">Nouvelle recette</a>
</nav>
{{with .Utilisateur}}
<div class="compte">
<span>Connecté en tant que {{.Nom}}</span>
<form method="post" action="/deconnexion"><button type="submit">Déconnexion</button></form>
</div>
{{else}}
<div class="compte"><a href="/connexion">Connexion</a></div>
{{end}}
</header>
<main>{{template "contenu" .}}</main>
<footer>Patachoo — carnet de recettes</footer>
</body>
</html>
